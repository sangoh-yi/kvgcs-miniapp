<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<title>ThreeStar</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#060b14;color:#dbe6f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
#tsxLock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;box-sizing:border-box;
 background:radial-gradient(120% 90% at 50% 10%,#14243d 0%,#0a1322 50%,#05090f 100%)}
#tsxLock[hidden]{display:none}
.tsx-card{width:min(360px,100%);box-sizing:border-box;padding:28px 22px 22px;border:1px solid #1f3350;border-radius:16px;
 background:rgba(10,18,32,.86);box-shadow:0 0 0 1px rgba(88,166,255,.06),0 20px 60px rgba(0,0,0,.5);text-align:center}
.tsx-stars{display:inline-flex;gap:6px;padding:6px 12px;border:1.5px solid #c9a227;border-radius:8px;background:#0b1426;
 color:#f2c94c;font-size:20px;letter-spacing:2px;text-shadow:0 0 10px rgba(242,201,76,.55)}
.tsx-name{margin:12px 0 2px;font-size:24px;font-weight:800;letter-spacing:.5px}
.tsx-name b{color:#f2c94c;font-weight:800}
.tsx-sub{margin:0 0 20px;font-size:12.5px;color:#8ea3bd}
.tsx-in{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1.5px solid #2a4366;background:#0b1526;
 color:#eef4fb;font-size:18px;letter-spacing:4px;text-align:center;outline:none}
.tsx-in:focus{border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.18)}
.tsx-btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:linear-gradient(180deg,#2f81f7,#1f6feb);
 color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.tsx-btn[disabled]{opacity:.6;cursor:wait}
.tsx-msg{min-height:18px;margin:12px 0 0;font-size:12.5px;line-height:1.5;color:#8ea3bd}
.tsx-msg.err{color:#ff7b72}
</style></head><body>
<div id="tsxLock" hidden>
 <form class="tsx-card" id="tsxForm" autocomplete="off">
  <div class="tsx-stars" aria-hidden="true">&#9733;&#9733;&#9733;</div>
  <div class="tsx-name">Three<b>Star</b></div>
  <p class="tsx-sub">세종 22m 관측 현황 · 잠긴 화면</p>
  <input class="tsx-in" id="tsxPw" type="password" autocomplete="current-password" placeholder="암호" aria-label="암호">
  <button class="tsx-btn" id="tsxGo" type="submit">열기</button>
  <p class="tsx-msg" id="tsxMsg">처음 한 번만 넣으면 이 기기에서 기억합니다</p>
 </form>
</div>
<script>

 "ts/wxtomo.html", "ts/wxtomo3d.js", "ts/wxtomo_core.js"], LSK="tsx_k1";

 function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
 function unb64(s){var t=atob(s),a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a;}

   if(!r.ok)throw new Error(rel+' HTTP '+r.status);return json?r.json():r.arrayBuffer();});}

 function imp(raw){return C.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);}

   return w&&w.CloudStorage&&w.isVersionAtLeast&&w.isVersionAtLeast('6.9')?w:null;}catch(e){return null;}}

   var s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.async=true;
   s.onload=s.onerror=function(){ok();};document.head.appendChild(s);setTimeout(ok,3000);});}

   try{w.CloudStorage.getItem(LSK,function(e,v){if(!done){done=true;ok(e?null:(v||null));}});}catch(e){return ok(null);}
   setTimeout(function(){if(!done){done=true;ok(null);}},2500);});}
 function cloudSet(v){return new Promise(function(ok){var w=tgw();if(!w)return ok();
   try{w.CloudStorage.setItem(LSK,v,function(){ok();});}catch(e){return ok();}setTimeout(ok,2500);});}
 function relOf(u){var h=new URL(String(u),location.href).href.split('#')[0].split('?')[0];
   return h.indexOf(base)===0?h.slice(base.length):null;}

   var T={key:key,base:base,build:B,
     has:function(u){var r=relOf(u);return !!r&&OWN.indexOf(r)>=0;},
     fetch:function(rel){return get('x/'+rel+'.bin').then(function(b){return dec(key,b);});},
     text:function(rel){return T.fetch(rel).then(function(b){return new TextDecoder().decode(b);});},
     js:function(u){var rel=relOf(u)||String(u);return T.text(rel).then(function(code){
       var s=document.createElement('script');s.textContent=code+'\n//# sourceURL='+base+rel;document.head.appendChild(s);});},
     glb:function(u){var rel=relOf(u);if(!rel||OWN.indexOf(rel)<0){var n=String(u).split('#')[0].split('?')[0].split('/').pop();
       rel=null;for(var i=0;i<OWN.length;i++){if(OWN[i].split('/').pop()===n){rel=OWN[i];break;}}}
       return rel?T.fetch(rel):Promise.reject(new Error('잠긴 모형 없음: '+u));}};
   window.TSX=T;
   return T.text(REL).then(function(html){document.open();document.write(html);document.close();});}

   setTimeout(function(){try{$('tsxPw').focus();}catch(e){}},60);}
 function derive(pw){return C.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
   return C.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(LOCK.salt),iterations:LOCK.iter},k,256);});}
 $('tsxForm').addEventListener('submit',function(e){e.preventDefault();var pw=$('tsxPw').value;if(!pw||!LOCK)return;
   var btn=$('tsxGo');btn.disabled=true;ask('확인 중…');
   derive(pw).then(function(raw){var s=b64(raw);return tryKey(s).then(function(k){
     if(!k){btn.disabled=false;$('tsxPw').value='';ask('암호가 맞지 않습니다',true);return;}
     lsSet(s);return cloudSet(s).then(function(){return show(k);});});})
   .catch(function(x){btn.disabled=false;ask('열지 못했습니다 — '+((x&&x.message)||x),true);});});
 function start(){
   if(!C){ask('이 브라우저에서는 잠금을 풀 수 없습니다(https 필요)',true);return;}
   get('lock.json',true).then(function(j){LOCK=j;
     return tryKey(lsGet()).then(function(k){if(k)return show(k);
       lsDel();if(!TG){ask();return;}
       return loadTG().then(cloudGet).then(function(s){return tryKey(s).then(function(k2){
         if(k2){lsSet(s);return show(k2);}ask();});});});})
   .catch(function(x){ask('불러오지 못했습니다 — '+((x&&x.message)||x),true);});}
