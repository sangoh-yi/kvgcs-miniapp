     glb:function(u){var rel=relOf(u);if(!rel||OWN.indexOf(rel)<0){var n=String(u).split('#')[0].split('?')[0].split('/').pop();
       rel=null;for(var i=0;i<OWN.length;i++){if(OWN[i].split('/').pop()===n){rel=OWN[i];break;}}}

 function ask(msg,err){$('tsxLock').hidden=false;var m=$('tsxMsg');if(msg)m.textContent=msg;m.className='tsx-msg'+(err?' err':'');
   setTimeout(function(){try{$('tsxPw').focus();}catch(e){}},60);}
 function derive(pw){return C.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
   return C.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(LOCK.salt),iterations:LOCK.iter},k,256);});}
 $('tsxForm').addEventListener('submit',function(e){e.preventDefault();var pw=$('tsxPw').value;if(!pw||!LOCK)return;
   var btn=$('tsxGo');btn.disabled=true;ask('확인 중…');
   derive(pw).then(function(raw){var s=b64(raw);return tryKey(s).then(function(k){
     if(!k){btn.disabled=false;$('tsxPw').value='';ask('암호가 맞지 않습니다',true);return;}
     lsSet(s);return cloudSet(s).then(function(){return show(k);});});})
   .catch(function(x){btn.disabled=false;ask('열지 못했습니다 — '+((x&&x.message)||x),true);});});
 function tgPost(t,d){try{var e=d||{};          /* 10-07 텔레그램 스크립트 없이 앱 다리로 — 관측소 망은 telegram.org 를 막는다 */
   if(window.TelegramWebviewProxy&&window.TelegramWebviewProxy.postEvent){window.TelegramWebviewProxy.postEvent(t,JSON.stringify(e));return;}
   if(window.external&&typeof window.external.notify==='function'){window.external.notify(JSON.stringify({eventType:t,eventData:e}));return;}
   if(window.parent&&window.parent!==window)window.parent.postMessage(JSON.stringify({eventType:t,eventData:e}),'https://web.telegram.org');}catch(x){}}

     return tryKey(lsGet()).then(function(k){if(k)return show(k);
       lsDel();if(!TG){ask();return;}
       return loadTG().then(cloudGet).then(function(s){return tryKey(s).then(function(k2){
         if(k2){lsSet(s);return show(k2);}ask();});});});})
   .catch(function(x){ask('불러오지 못했습니다 — '+((x&&x.message)||x),true);});}
 start();
