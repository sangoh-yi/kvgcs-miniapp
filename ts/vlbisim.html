<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ThreeStar VLBI 모의</title>
<!-- VLBI 전 과정 모의(2026-10-05): 관측 기하 → 신호 경로·지연 → 수신·2비트 기록 → 상관(FX) → 프린지 탐색 → 기선 해석.
     계산 vlbisim_core.js(브라우저에서 실제로 돈다) · 3D vlbisim3d.js · 자산 models/vlbisim/(블렌더) · 자료 models/vlbisim/vlbisim_data.json(IVS VEX) -->
<style>
:root{--bg:#0a1120;--panel:#0f1a2c;--panel2:#13223a;--line:#1f3150;--tx:#dbe7f5;--dim:#8ea3c0;--ac:#37e8cf;--warn:#f0b44c;--bad:#ff6b8a;
  --x:#5fe3ff;--s:#ffb44c;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.5 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1b30,#0b1424)}
.rank{display:inline-flex;gap:2px;padding:3px 6px;border:1px solid #c9a13c;border-radius:4px;color:#f2c94c;font-size:12px;letter-spacing:1px}
.brand{font-weight:800;font-size:15px}.brand span{color:var(--warn)}
h1{font-size:14px;font-weight:700;margin:0 0 0 4px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;overflow:hidden;max-height:26px}
.chip{padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:11.5px;white-space:nowrap}
.chip b{color:var(--tx);font-family:var(--mono);font-weight:600}
.back{margin-left:auto;color:var(--tx);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;white-space:nowrap}
.back:hover{border-color:var(--ac)}
main{display:grid;grid-template-columns:minmax(0,1fr) 470px;height:calc(100% - 50px)}
.view{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#cv{flex:1 1 auto;width:100%;min-height:0;display:block;cursor:grab;touch-action:none;background:#040913}
#cv:active{cursor:grabbing}
.vbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
button{font:inherit}
.vbar button,.seg button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.vbar button.on,.seg button.on{border-color:var(--ac);color:var(--ac)}
.vbar .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
.status{padding:5px 10px;border-top:1px solid var(--line);background:#0b1528;color:var(--dim);font-size:12px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:27px}
.status b{color:var(--ac);font-weight:600}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font-weight:700;padding:10px 0;cursor:pointer}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.pane{flex:1 1 auto;overflow:auto;padding:10px 14px 18px;display:none}
.pane.on{display:block}
.go{display:flex;gap:6px;margin:2px 0 8px}
.go button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-weight:700;cursor:pointer}
.go button.pri{border-color:var(--ac);background:rgba(55,232,207,.12);color:var(--ac)}
.go button:disabled{opacity:.45;cursor:default}
.bar{height:6px;border-radius:4px;background:#0b1528;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#5fb8ff);transition:width .2s}
.cnt{display:flex;justify-content:space-between;color:var(--dim);font-size:11.5px;margin:4px 0 8px;font-family:var(--mono)}
.steps{display:flex;gap:4px;margin:4px 0 8px}
.steps button{flex:1;padding:6px 0;border-radius:7px;border:1px solid var(--line);background:#0b1528;color:var(--dim);font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.steps button.on{border-color:var(--ac);color:var(--ac);background:rgba(55,232,207,.08)}
.steps button.done{color:var(--tx)}
.steps button.done::after{content:" ✓";color:var(--ac)}
h2{font-size:13px;margin:8px 0 4px;display:flex;align-items:baseline;gap:6px}
h2 small{color:var(--dim);font-weight:400;font-size:11px}
h3{font-size:12px;margin:12px 0 4px;color:var(--tx)}
.note{color:var(--dim);font-size:11.8px;line-height:1.6;margin:4px 0}
.eq{font-family:var(--mono);font-size:11.5px;color:#cfe4ff;background:#0b1528;border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin:6px 0;white-space:pre-wrap;line-height:1.55}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim);margin-left:4px;vertical-align:1px}
.tag.live{border-color:#2f7d6d;color:var(--ac)}
canvas.plot{width:100%;height:190px;display:block;background:#0b1528;border:1px solid var(--line);border-radius:8px;margin:6px 0}
canvas.plot.tall{height:240px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{color:var(--dim);font-weight:600;font-size:10.5px;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:3px 4px;border-bottom:1px solid rgba(31,49,80,.55);text-align:right;font-family:var(--mono);white-space:nowrap}
td.n{font-family:inherit;font-weight:700}
#stepBody table{display:block;overflow-x:auto;max-width:100%}#stepBody table>tbody{display:table;width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv span{color:var(--dim)}.kv b{font-family:var(--mono);font-weight:600;text-align:right}
.box{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel2);margin:8px 0}
.ctl{display:grid;grid-template-columns:132px 1fr;gap:7px 10px;align-items:center;font-size:12px}
.ctl label{color:var(--dim)}
select,input[type=number]{background:#0b1528;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px;width:100%}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:inline-flex;gap:4px;align-items:center;color:var(--tx)}
.good{color:var(--ac)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim)}.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:2px}
ol{margin:4px 0 0 18px;padding:0}ol li{margin:3px 0}
body.embed header .back{display:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  h1,.chips{display:none}
  .steps button{font-size:10.5px}
}
</style>
</head>
<body>
<header>
  <span class="rank">★★★</span><span class="brand">Three<span>Star</span></span>
  <h1>VLBI 전 과정 모의</h1>
  <div class="chips"><span class="chip">기선 <b id="cBase">—</b></span><span class="chip">세션 <b id="cSess">—</b></span><span class="chip">스캔 <b id="cScan">—</b></span><span class="chip">길이 <b id="cLen">—</b></span></div>
  <a class="back" href="/" id="back">← 운용 화면</a>
</header>
<main>
  <div class="view">
    <canvas id="cv"></canvas>
    <div class="vbar">
      <button data-v="sky" class="on">우주 · 파면</button><button data-v="chain">신호 사슬</button><button data-v="corr">상관기 · 프린지</button><button data-v="base">기선 해석</button><button data-v="ut1">UT1 · 자전각</button>
      <span class="sep"></span><span style="color:var(--dim);font-size:11.5px">속도</span>
      <span class="seg" id="speed"><button data-k="0.5">0.5×</button><button data-k="1" class="on">1×</button><button data-k="3">3×</button></span>
    </div>
    <div class="status" id="status">불러오는 중…</div>
  </div>
  <aside>
    <div class="tabs"><button class="on" data-p="pRun">과정</button><button data-p="pSet">설정</button><button data-p="pThe">이론 · 한계</button></div>
    <div class="pane on" id="pRun">
      <div class="note">두 안테나가 같은 ICRF 전파원을 수소메이저 시각에 맞춰 동시에 기록하고, 상관기가 두 기록을 맞대어 지연을 재고, 여러 스캔의 지연으로 기선을 푸는 과정을 그대로 돌립니다. 계산은 이 화면에서 실제로 합니다. <b>화면 안 모의 — 장비 명령은 없습니다.</b></div>
      <div class="go"><button class="pri" id="bRun">▶ 전 과정 실행</button><button id="bCheck">검산(몬테카를로)</button><button id="bStop" hidden>■ 그만</button></div>
      <div class="bar"><i id="pbar"></i></div><div class="cnt"><span id="cntA">준비</span><span id="cntB"></span></div>
      <div class="steps" id="steps"><button data-s="1" class="on">1 기하</button><button data-s="2">2 지연</button><button data-s="3">3 기록</button><button data-s="4">4 상관</button><button data-s="5">5 프린지</button><button data-s="6">6 기선</button><button data-s="7">7 UT1</button></div>
      <div id="stepBody"></div>
    </div>
    <div class="pane" id="pSet">
      <h2>관측</h2>
      <div class="ctl">
        <label>세션(IVS 스케줄)</label><select id="sSess"></select>
        <label>기선(세종 –)</label><select id="sSt2"></select>
        <label>스캔(그림·신호 모의)</label><select id="sScan"></select>
      </div>
      <h2>참값(모의에 넣는 진짜 값) <small>해석은 이 값을 모른 채 푼다</small></h2>
      <div class="ctl">
        <label>시계 차 c₀ (ns)</label><input type="number" id="vC0" value="230" step="10">
        <label>시계 변화율 (10⁻¹⁴ s/s)</label><input type="number" id="vC1" value="1.4" step="0.2">
        <label>국 2 선험 위치 오차 X·Y·Z (mm)</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px"><input type="number" id="vDx" value="31"><input type="number" id="vDy" value="-24"><input type="number" id="vDz" value="18"></div>
        <label>천정 습윤 지연 국1·국2 (cm)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><input type="number" id="vZ1" value="15"><input type="number" id="vZ2" value="12"></div>
        <label>VTEC 국1·국2 (TECU)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><input type="number" id="vT1" value="18"><input type="number" id="vT2" value="25"></div>
        <label>전파원 세기 배율</label><input type="number" id="vFlux" value="1" step="0.25" min="0.1">
        <label>잡음</label><div class="chk"><label><input type="checkbox" id="nTh" checked>열잡음</label><label><input type="checkbox" id="nMa" checked>메이저</label><label><input type="checkbox" id="nTr" checked>대류권 변동</label></div>
      </div>
      <h2>신호 모의</h2>
      <div class="ctl">
        <label>AP 수 K</label><select id="vK"><option>16</option><option selected>32</option><option>64</option></select>
        <label>AP 당 표본 N</label><select id="vN"><option>2048</option><option selected>4096</option><option>8192</option></select>
      </div>
      <h2>해석</h2>
      <div class="ctl">
        <label>관측 지연 만들기</label><select id="vLv"><option value="obs" selected>관측량 수준 — σ 식으로 잡음(빠름)</option><option value="signal">신호 수준 — 스캔마다 상관·프린지(웹 워커)</option></select>
        <label>신호 수준 크기</label><select id="vLvK"><option value="16x2048" selected>AP 16 × 2048 표본(빠름)</option><option value="32x4096">AP 32 × 4096 표본(정밀)</option></select>
        <label>대류권 추정</label><select id="vZm"><option value="pwl" selected>2시간 꺾은선(제약 1.5 cm)</option><option value="const">세션 상수</option></select>
        <label>재가중</label><select id="vRw"><option value="1" selected>χ²/자유도 = 1 이 되게</option><option value="0">하지 않음</option></select>
        <label>난수 씨앗</label><input type="number" id="vSeed" value="7">
      </div>
      <div class="note">설정을 바꾸면 '▶ 전 과정 실행'을 다시 누르세요.</div>
    </div>
    <div class="pane" id="pThe"></div>
  </aside>
</main>
<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script src="./sejong22m.js"></script>
<script src="vlbisim_core.js"></script>
<script src="vlbisim3d.js"></script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id), VS = window.VSCore, D2R = Math.PI / 180;
const QS = new URLSearchParams(location.search); if (QS.has('embed')) document.body.classList.add('embed');
const f = (v, d) => (v == null || !isFinite(v) ? '—' : (+v).toFixed(d));
const sg = (v, d) => (v == null || !isFinite(v) ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d));
const kst = (u) => { const d = new Date((u + 9 * 3600) * 1000); return d.toISOString().slice(5, 16).replace('T', ' '); };
const utc = (u) => new Date(u * 1000).toISOString().slice(11, 16);
let D = null, BND = null, V3 = null, CUR = { step: 1 }, RUN = null, SPEED = 1, busy = false, RD = null, RMODE = 'sim', WK = null;
window.__VS = { get V3() { return V3; }, get RUN() { return RUN; } };     // 시험·점검용(헤드리스 화면 확인)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));

// ───── 자료 ─────
// 잠금판(miniapp_lock)이면 자료도 암호문 — TSX 로 풀어 읽는다(10-05). 아니면 주소 그대로
const getJSON = (u) => (window.TSX && TSX.has && TSX.has(u))
  ? TSX.text(new URL(u, location.href).href.split('?')[0].slice(TSX.base.length)).then((t) => JSON.parse(t))
  : fetch(u).then((r) => (r.ok ? r.json() : Promise.reject(new Error(u + ' ' + r.status))));
getJSON('models/vlbisim/vlbisim_data.json').then(init).catch((e) => { $('status').textContent = '자료를 못 읽음: ' + e; });
function stLabel(st) { return st.label || `${st.name} · ${st.id}`; }
function stShort(st) { return (st.short || st.name) + ' ' + st.id; }
function init(d) {
  D = d; BND = VS.bands(d.freq);
  const sessOpts = Object.entries(D.sessions).filter(([k, v]) => v.n > 0);
  $('sSess').innerHTML = sessOpts.map(([k, v]) => `<option value="${k}">${v.title} · 세종 스캔 ${v.n} · ${kst(v.t0).slice(0, 5)}</option>`).join('');
  $('sSess').value = QS.get('sess') && D.sessions[QS.get('sess')] ? QS.get('sess') : (D.default && D.default.session) || 'r41279';
  const reload = () => { location.search = '?sess=' + $('sSess').value + '&st2=' + $('sSt2').value + (QS.has('embed') ? '&embed=1' : ''); };
  $('sSess').onchange = () => { fillSt2(true); reload(); };
  fillSt2(false);
  $('sSt2').onchange = reload;
  pickBaseline();
  V3 = window.VS3D.create($('cv'), { assetsUrl: 'models/vlbisim/vlbisim_assets.glb', sejongUrl: 'models/sejong22m.glb', names: [stShort(RUN.st1), stShort(RUN.st2)], dish2: RUN.st2.dish || 12,
    onload: () => { $('status').innerHTML = `준비 — <b>▶ 전 과정 실행</b> · 기선 ${RUN.baseName} · 끌어서 돌리기 · 휠 확대 · 안테나는 지구 위에서 약 1만 배 크게 그렸다`; },
    onerror: (e) => { $('status').textContent = '3D 자산을 못 읽음: ' + e; } });
  new ResizeObserver(() => V3 && V3.resize()).observe($('cv'));
  setScan(); showStep(1); theory();
  getJSON('models/vlbisim/realdata.json').then((j) => { RD = j; if (CUR.step >= 4) showStep(CUR.step); }).catch(() => { RD = { err: 1 }; });
}
function fillSt2(fromSess) {
  const sess = $('sSess').value, s1 = D.stations.SEJONG, opts = [];
  for (const [nm, st] of Object.entries(D.stations)) {
    if (nm === 'SEJONG') continue;
    const n = VS.commonScans(D, sess, s1.id, st.id).length; if (n >= 8) opts.push([nm, n]);
  }
  opts.sort((a, b) => (a[0] === 'KOKEE' ? -1 : b[0] === 'KOKEE' ? 1 : b[1] - a[1]));
  $('sSt2').innerHTML = opts.map(([nm, n]) => `<option value="${nm}">${stLabel(Object.assign({ name: nm }, D.stations[nm]))} · 공통 스캔 ${n}</option>`).join('');
  const want = !fromSess && QS.get('st2') ? QS.get('st2') : (D.default && D.default.st2) || 'KOKEE';
  $('sSt2').value = opts.some((o) => o[0] === want) ? want : (opts[0] ? opts[0][0] : '');
}
function pickBaseline() {
  const sess = $('sSess').value, nm = $('sSt2').value, st1 = VS.stationFor(D, sess, 'SEJONG'), st2 = VS.stationFor(D, sess, nm);
  const L = VS.nrm(VS.sub(st2.xyz, st1.xyz));
  const scans = VS.commonScans(D, sess, st1.id, st2.id, L / 1e3);
  const baseName = nm === 'KOKEE' ? '세종–코키 파크(하와이)' : `세종–${st2.short || nm}`;
  RUN = { sess, st1, st2, st2name: stShort(st2), baseName, scans, scanIx: 0, res: {} };
  let bi = 0; scans.forEach((s, i) => { if (s.T * s.fluxX > scans[bi].T * scans[bi].fluxX) bi = i; });
  $('sScan').innerHTML = scans.map((s, i) => `<option value="${i}">${utc(s.t_start)} UT · ${s.name} · ${s.T} s · X ${f(s.fluxX, 2)} Jy</option>`).join('');
  $('sScan').value = bi; RUN.scanIx = bi;
  $('sScan').onchange = () => { RUN.scanIx = +$('sScan').value; RUN.res = {}; setScan(); showStep(CUR.step); };
  $('cBase').textContent = baseName; $('cLen').textContent = f(L / 1e3, 1) + ' km'; $('cSess').textContent = D.sessions[sess].title.split(' ')[0];
  document.title = `ThreeStar VLBI 모의 · ${baseName}`;
}
function cfg() {
  return { c0: +$('vC0').value * 1e-9, c1: +$('vC1').value * 1e-14, dx: [+$('vDx').value / 1e3, +$('vDy').value / 1e3, +$('vDz').value / 1e3],
    z1: +$('vZ1').value / 100, z2: +$('vZ2').value / 100, t1: +$('vT1').value, t2: +$('vT2').value, flux: +$('vFlux').value || 1,
    th: $('nTh').checked, ma: $('nMa').checked, tr: $('nTr').checked, K: +$('vK').value, N: +$('vN').value, zm: $('vZm').value, rw: $('vRw').value === '1', seed: +$('vSeed').value || 7,
    lv: $('vLv').value, lvK: $('vLvK').value.split('x').map(Number) };
}
// 스캔 하나의 참·선험 모형
function scanModels() {
  const c = cfg(), sc = RUN.scans[RUN.scanIx], st1 = RUN.st1, st2 = RUN.st2, t0 = sc.t;
  const PT = { x1: st1.xyz, x2: VS.add(st2.xyz, c.dx), clk: (t) => c.c0 + c.c1 * t, zhd1: VS.zhd(st1.xyz), zhd2: VS.zhd(st2.xyz), zwd1: c.z1, zwd2: c.z2, vtec1: c.t1, vtec2: c.t2 };

// ───── 그림 도구(캔버스 — 3D 밖) ─────
function cvs(id) { const c = $(id); if (!c) return null; const r = c.getBoundingClientRect(), dp = Math.min(devicePixelRatio || 1, 2); c.width = r.width * dp; c.height = r.height * dp; const g = c.getContext('2d'); g.scale(dp, dp); return { g, w: r.width, h: r.height }; }
function plot(id, series, o) {
  const P = cvs(id); if (!P) return; const { g, w, h } = P, L = 46, R = o.r2 ? 46 : 10, Tp = 16, Bt = 26, pw = w - L - R, ph = h - Tp - Bt;
  let x0 = o.x0, x1 = o.x1, y0 = o.y0, y1 = o.y1;
  const all = series.filter((s) => !s.right);
  if (x0 == null) { x0 = Infinity; x1 = -Infinity; for (const s of series) for (const x of s.x) { if (x < x0) x0 = x; if (x > x1) x1 = x; } }
  if (y0 == null) { y0 = Infinity; y1 = -Infinity; for (const s of all) for (let i = 0; i < s.y.length; i++) { const lo = s.y[i] - (s.e ? s.e[i] : 0), hi = s.y[i] + (s.e ? s.e[i] : 0); if (lo < y0) y0 = lo; if (hi > y1) y1 = hi; } const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad; }
  const X = (x) => L + (x - x0) / (x1 - x0 || 1) * pw, Y = (y) => Tp + (1 - (y - y0) / (y1 - y0 || 1)) * ph;
  g.strokeStyle = '#1f3150'; g.lineWidth = 1; g.font = '10.5px ui-monospace,Consolas,monospace'; g.fillStyle = '#8ea3c0';
  for (let i = 0; i <= 4; i++) { const yy = y0 + (y1 - y0) * i / 4; g.beginPath(); g.moveTo(L, Y(yy)); g.lineTo(L + pw, Y(yy)); g.stroke(); g.textAlign = 'right'; g.fillText(o.yf ? o.yf(yy) : yy.toPrecision(3), L - 4, Y(yy) + 3); }
  for (let i = 0; i <= 5; i++) { const xx = x0 + (x1 - x0) * i / 5; g.textAlign = 'center'; g.fillText(o.xf ? o.xf(xx) : xx.toPrecision(3), X(xx), h - Bt + 13); }
  g.textAlign = 'left'; g.fillStyle = '#b8c8de'; g.fillText(o.title || '', L, 11); g.textAlign = 'right'; g.fillStyle = '#8ea3c0'; g.fillText(o.xl || '', L + pw, h - 3);
  if (o.hline != null) { g.strokeStyle = 'rgba(240,180,76,.6)'; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(L, Y(o.hline)); g.lineTo(L + pw, Y(o.hline)); g.stroke(); g.setLineDash([]); }
  if (o.vline != null) { g.strokeStyle = 'rgba(55,232,207,.7)'; g.beginPath(); g.moveTo(X(o.vline), Tp); g.lineTo(X(o.vline), Tp + ph); g.stroke(); }
  for (const s of series) {
    const yy = s.right ? ((v) => Tp + (1 - (v - o.r0) / (o.r1 - o.r0)) * ph) : Y;
    g.strokeStyle = s.c; g.fillStyle = s.c; g.lineWidth = s.lw || 1.6;
    if (s.e) { g.globalAlpha = 0.45; for (let i = 0; i < s.x.length; i++) { g.beginPath(); g.moveTo(X(s.x[i]), yy(s.y[i] - s.e[i])); g.lineTo(X(s.x[i]), yy(s.y[i] + s.e[i])); g.stroke(); } g.globalAlpha = 1; }
    if (s.dots) { for (let i = 0; i < s.x.length; i++) { g.beginPath(); g.arc(X(s.x[i]), yy(s.y[i]), s.r || 2, 0, 7); g.fill(); } }
    else if (s.bars) { for (let i = 0; i < s.x.length; i++) { const bw = Math.max(1, s.bw * pw / (x1 - x0)); g.fillRect(X(s.x[i]) - bw / 2, yy(s.y[i]), bw, yy(o.y0 != null ? o.y0 : 0) - yy(s.y[i])); } }
    else { g.beginPath(); let up = false; for (let i = 0; i < s.x.length; i++) { const v = s.y[i]; if (v == null || !isFinite(v)) { up = false; continue; } if (!up) { g.moveTo(X(s.x[i]), yy(v)); up = true; } else g.lineTo(X(s.x[i]), yy(v)); } g.stroke(); }
  }
  if (o.r2) { g.fillStyle = '#8ea3c0'; g.textAlign = 'left'; for (let i = 0; i <= 4; i++) { const v = o.r0 + (o.r1 - o.r0) * i / 4; g.fillText(o.rf ? o.rf(v) : v.toPrecision(2), L + pw + 4, Tp + (1 - i / 4) * ph + 3); } }
}
function heat(id, grid, o) {
  const P = cvs(id); if (!P) return; const { g, w, h } = P, L = 46, R = 10, Tp = 16, Bt = 26, pw = w - L - R, ph = h - Tp - Bt;
  const ny = grid.length, nx = grid[0].length; let mx = 0; for (const r of grid) for (const v of r) mx = Math.max(mx, v);
  const img = g.createImageData(nx, ny);
  for (let i = 0; i < ny; i++) for (let j = 0; j < nx; j++) { const a = grid[i][j] / (mx || 1), c = ramp(a), k = 4 * ((ny - 1 - i) * nx + j); img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255; }

  g.imageSmoothingEnabled = true; g.drawImage(tc, L, Tp, pw, ph);
  g.font = '10.5px ui-monospace,Consolas,monospace'; g.fillStyle = '#b8c8de'; g.textAlign = 'left'; g.fillText(o.title || '', L, 11);
  g.fillStyle = '#8ea3c0'; g.textAlign = 'center';
  for (let i = 0; i <= 4; i++) { g.fillText(o.xf(i / 4), L + pw * i / 4, h - Bt + 13); }
  g.textAlign = 'right'; for (let i = 0; i <= 4; i++) g.fillText(o.yf(i / 4), L - 4, Tp + ph * (1 - i / 4) + 3);
  g.textAlign = 'right'; g.fillText(o.xl || '', L + pw, h - 3);
  if (o.mark) { g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.beginPath(); g.arc(L + pw * o.mark[0], Tp + ph * (1 - o.mark[1]), 6, 0, 7); g.stroke(); }
}
function ramp(a) { const s = [[5, 12, 50], [12, 88, 178], [38, 204, 216], [242, 216, 90], [255, 255, 242]]; const x = Math.max(0, Math.min(0.999, a)) * (s.length - 1), i = Math.floor(x), t = x - i; return [0, 1, 2].map((k) => Math.round(s[i][k] + (s[i + 1][k] - s[i][k]) * t)); }
