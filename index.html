<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세종 VLBI 관측 현황</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ── 테마 — [테마] 탭에서 고르면 <html data-theme> 로 갈린다. 기본은 기기 설정 따라감 ── */
  :root, [data-theme="dark"]{
    --bg:#080e16;--bg2:#0d1723;--card:#121d2c;--card2:#162435;--line:#22344c;
    --tx:#e9f1fa;--dim:#8ba0b8;--navy:#4aa3ff;--gold:#eab94a;--ok:#2fd982;--warn:#f5a83c;--bad:#ff5f54;
    --scan:.035;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme]){--bg:#eaeff7;--bg2:#e1e8f2;--card:#fff;--card2:#f4f7fb;--line:#d7e1ee;
      --tx:#0d1825;--dim:#5b6d85;--navy:#1670d6;--gold:#b3860f;--ok:#10a45b;--warn:#d18a10;--bad:#db392e;}
  }
  [data-theme="light"]{--bg:#eaeff7;--bg2:#e1e8f2;--card:#fff;--card2:#f4f7fb;--line:#d7e1ee;
    --tx:#0d1825;--dim:#5b6d85;--navy:#1670d6;--gold:#b3860f;--ok:#10a45b;--warn:#d18a10;--bad:#db392e;--scan:.02;}
  /* 관제실 — 검정 바탕에 앰버, 야간 당직에 눈이 편하다 */
  [data-theme="ops"]{--bg:#000;--bg2:#0a0906;--card:#12100a;--card2:#191509;--line:#3b3110;
    --tx:#ffd98a;--dim:#a38a4e;--navy:#ffb340;--gold:#ffd24a;--ok:#8fd14f;--warn:#ffa726;--bad:#ff5f52;--scan:.06;}
  /* 심야 — 명암을 낮춰 어두운 방에서 눈부시지 않게 */
  [data-theme="night"]{--bg:#04070b;--bg2:#070c12;--card:#0b1119;--card2:#0f1620;--line:#18232f;
    --tx:#b9c6d4;--dim:#68788a;--navy:#3f7fbf;--gold:#b08f45;--ok:#3f9e68;--warn:#b8863a;--bad:#b8564e;--scan:.02;}
  /* 청사진 — 남색 계열 단색, 보고·시연용 */
  [data-theme="blueprint"]{--bg:#071a2b;--bg2:#0a2338;--card:#0d2b44;--card2:#12354f;--line:#1d4a6e;
    --tx:#dcecf8;--dim:#8fb2cc;--navy:#5cc8ff;--gold:#ffd98a;--ok:#4fd6a0;--warn:#ffc46b;--bad:#ff7b72;--scan:.05;}
  /* 종이 — 밝은 배경, 인쇄·회의 화면 공유용 */
  [data-theme="paper"]{--bg:#f6f4ee;--bg2:#efece3;--card:#fff;--card2:#f7f5f0;--line:#ded9cc;
    --tx:#22201b;--dim:#6b6558;--navy:#1c5fa8;--gold:#96701a;--ok:#187a4a;--warn:#a86d10;--bad:#b8382c;--scan:0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(1000px 520px at 50% -8%,var(--bg2),var(--bg));
    color:var(--tx);font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    padding:0 11px calc(18px + env(safe-area-inset-bottom))}
  /* 스캔라인 — 계측 장비 느낌 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--scan,.035);
    background:repeating-linear-gradient(0deg,var(--tx) 0 1px,transparent 1px 3px)}
  #app,#top,#tabs,#foot{position:relative;z-index:1}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* 헤더 */
  #top{padding:12px 3px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #top .exp{font-size:23px;font-weight:850;letter-spacing:-.6px}
  #top .sub{font-size:10.5px;color:var(--dim);letter-spacing:.5px;margin-top:1px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
    font-size:11px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
  .c-live{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .c-idle{background:color-mix(in srgb,var(--dim) 16%,transparent);color:var(--dim)}
  .c-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
  .c-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.6s ease-out infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

  /* 탭 */
  #tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
    background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;
    transition:all .25s;white-space:nowrap}
  .tab.on{background:linear-gradient(135deg,var(--navy),color-mix(in srgb,var(--navy) 62%,var(--ok)));
    color:#fff;border-color:transparent;box-shadow:0 3px 14px color-mix(in srgb,var(--navy) 40%,transparent)}
  .tab .b{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:8px;
    background:color-mix(in srgb,var(--line) 60%,transparent);font-size:10.5px}
  .tab.on .b{background:rgba(255,255,255,.24)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;
    margin-bottom:10px;position:relative;overflow:hidden}
  .card.hero{background:linear-gradient(155deg,var(--card),color-mix(in srgb,var(--navy) 10%,var(--card)))}
  h2{font-size:11.5px;margin:0 0 11px;font-weight:800;color:var(--dim);letter-spacing:1.5px;
    display:flex;align-items:center;gap:7px;text-transform:uppercase}
  h2::before{content:"";width:3px;height:12px;background:var(--gold);border-radius:2px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lbl{color:var(--dim);font-size:11px;letter-spacing:.2px}
  .val{font-size:15.5px;font-weight:700}
  .grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
  .tile{background:var(--card2);border-radius:11px;padding:9px 10px;border:1px solid transparent}
  .tile.hot{border-color:color-mix(in srgb,var(--navy) 45%,transparent)}
  .ts-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .ts-h svg{width:54px;height:21px;flex:none}
  .ts-h b{font-size:15px}.ts-h b span{color:#d4af37}
  .ts-stack{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--line);margin:6px 0 4px}
  .ts-stack i{display:block;height:100%}
  .ts-al{font-size:12px;color:var(--warn);margin-top:4px}
  .tsl-clk{font-size:22px;font-weight:800;letter-spacing:.5px}
  .tsl-big{font-size:19px;font-weight:800}
  .tsl-sec{font-size:12.5px;font-weight:800;margin:2px 0 7px;display:flex;align-items:center;gap:6px}
  .tsl-pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700;line-height:17px;color:#fff}
  .tsl-links{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tsl-link{background:var(--card2);border-radius:9px;padding:6px 7px;font-size:11.5px;display:flex;align-items:center;gap:5px;min-width:0}
  .tsl-link i{width:8px;height:8px;border-radius:50%;flex:none}
  .tsl-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tsl-fil{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
  .tsl-fil div{padding:5px 11px;border-radius:999px;background:var(--card2);font-size:12px;white-space:nowrap;cursor:pointer}
  .tsl-fil div.on{background:var(--navy);color:#fff}
  .tsl-tr{display:grid;grid-template-columns:44px 1fr auto;gap:2px 8px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
  .tsl-tr.cur{background:color-mix(in srgb,var(--navy) 12%,transparent);border-radius:8px}
  .tsl-tr .t{color:var(--dim);font-size:11.5px}
  .tsl-tr .sub{grid-column:2/4;color:var(--dim);font-size:11px}
  /* ★ ThreeStar 메뉴 — 운용 화면과 같은 결(10-02): 유리질 카드·HUD 모서리·빛 막대·빛 구슬 */
  .tsm{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--card) 86%,var(--navy) 14%),var(--card) 60%);
    border:1px solid color-mix(in srgb,var(--navy) 28%,var(--line));box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}
  .tsm::before,.tsm::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid color-mix(in srgb,var(--navy) 60%,transparent);pointer-events:none}
  .tsm::before{top:5px;left:5px;border-right:0;border-bottom:0;border-top-left-radius:4px}
  .tsm::after{bottom:5px;right:5px;border-left:0;border-top:0;border-bottom-right-radius:4px}
  .tsm-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:8px}
  .tsm-h::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--navy),var(--ok));box-shadow:0 0 8px color-mix(in srgb,var(--navy) 60%,transparent)}
  .tsm-h .dim{font-weight:400;font-size:11px}
  .tsm .dim{color:var(--dim)}
  .tsm-top{display:flex;align-items:center;gap:10px}.tsm-top svg{width:56px;height:22px;flex:none;filter:drop-shadow(0 0 6px rgba(212,175,55,.45))}
  .tsm-brand{font-size:17px;text-shadow:0 0 14px color-mix(in srgb,var(--navy) 50%,transparent)}.tsm-brand span{color:#d4af37}
  .tsm-sess{margin-left:auto;display:flex;align-items:center;gap:6px}.tsm-sess b{font-size:16px}
  .tsm-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
    background:color-mix(in srgb,var(--navy) 16%,transparent);color:var(--navy);border:1px solid color-mix(in srgb,var(--navy) 40%,transparent)}
  .tsm-badge i{width:7px;height:7px;border-radius:50%;background:currentColor}.tsm-badge.run i{animation:tsmP 1.4s ease-in-out infinite}
  .tsm-badge.rec{color:#ff4d5e;background:rgba(255,77,94,.14);border-color:rgba(255,77,94,.5)}
  .tsm-hud{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
  .hud-o,.hud-a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:11.5px;border:1px solid var(--line);background:var(--card2)}
  .hud-o b{font-family:ui-monospace,monospace;letter-spacing:.08em}.hud-o span{color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud-o i,.hud-a i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .hud-o[data-k="rec"]{border-color:rgba(255,77,94,.6);box-shadow:0 0 14px rgba(255,77,94,.45)}.hud-o[data-k="rec"] b{color:#ff4d5e}
  .hud-o[data-k="rec"] i{background:#ff4d5e;box-shadow:0 0 9px #ff4d5e;animation:tsmB 1s steps(2,start) infinite}
  .hud-o[data-k="slew"] b{color:var(--warn)}.hud-o[data-k="slew"] i{background:var(--warn);animation:tsmP 1.2s infinite}
  .hud-o[data-k="arm"] b,.hud-o[data-k="prep"] b{color:var(--navy)}.hud-o[data-k="arm"] i,.hud-o[data-k="prep"] i{background:var(--navy);animation:tsmP 1.6s infinite}
  .hud-a{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent);animation:tsmA 1.1s ease-in-out infinite}.hud-a i{background:var(--bad)}
  .tsm-clk{margin-left:auto;text-align:right;line-height:1.15}.tsm-clk b{font-size:20px;text-shadow:0 0 12px color-mix(in srgb,var(--navy) 50%,transparent)}
  @keyframes tsmB{to{visibility:hidden}}@keyframes tsmP{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
  @keyframes tsmA{0%,100%{box-shadow:0 0 0 rgba(255,95,84,0)}50%{box-shadow:0 0 16px rgba(255,95,84,.55)}}
  .tsm-prog-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}.tsm-prog-h b{font-size:16px}
  .tsm-pct{font-family:ui-monospace,monospace;font-weight:800;font-size:16px;background:linear-gradient(180deg,var(--tx),var(--ok) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(47,217,130,.35))}
  .tsm-prog{display:flex;gap:1px;height:13px;border-radius:7px;overflow:hidden;background:var(--line);margin:7px 0 6px;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
  .tsm-prog i{position:relative}.tsm-prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%,rgba(0,0,0,.22))}
  .tsm-prog i:first-child{box-shadow:0 0 12px color-mix(in srgb,var(--ok) 60%,transparent)}
  .tsm-prog::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:tsmS 2.8s linear infinite}
  @keyframes tsmS{from{background-position:-40% 0}to{background-position:140% 0}}
  .tsm-leg{display:flex;flex-wrap:wrap;gap:4px 11px;font-size:11px;color:var(--dim)}.tsm-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
  .tsm-leg b{color:var(--tx);font-family:ui-monospace,monospace}.tsm-leg .z{opacity:.45}
  .tsm-scan{display:flex;align-items:center;gap:8px}.tsm-scan .mono{font-size:22px;font-weight:800}
  .tsm-tag{font-size:10.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim);background:var(--card2)}
  .tsm-step{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);font-size:10.5px;color:var(--dim);text-align:center}
  .tsm-step li{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tsm-step li::before{content:"";position:absolute;top:8px;right:50%;width:100%;height:3px;border-radius:2px;background:var(--line);z-index:0}
  .tsm-step li:first-child::before{display:none}
  .tsm-step li i{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);background:var(--card);z-index:1}
  .tsm-step li.done,.tsm-step li.cur{color:var(--tx)}.tsm-step li.cur{font-weight:800}
  .tsm-step li.done::before,.tsm-step li.cur::before{background:linear-gradient(90deg,var(--ok),#8ef0a0);box-shadow:0 0 7px color-mix(in srgb,var(--ok) 60%,transparent)}
  .tsm-step li.done i{background:radial-gradient(circle at 35% 30%,#b6f5c2,var(--ok) 60%,#157a43);border-color:#8ef0a0;box-shadow:0 0 9px color-mix(in srgb,var(--ok) 60%,transparent)}
  .tsm-step li.cur i{background:radial-gradient(circle at 35% 30%,#cfe6ff,var(--navy) 60%,#1f5fb0);border-color:var(--navy);box-shadow:0 0 0 4px color-mix(in srgb,var(--navy) 22%,transparent),0 0 14px var(--navy);animation:tsmP 1.4s infinite}
  .tsm-step li.cur.rec i{background:radial-gradient(circle at 35% 30%,#ffd0d4,#ff4d5e 60%,#a3141f);border-color:#ff8a95;box-shadow:0 0 0 4px rgba(255,77,94,.2),0 0 16px #ff4d5e}
  .tsm-cd .tsm-big{font-size:25px;font-weight:800;color:var(--dim);line-height:1.15}
  .tsm-cd.on{border-color:color-mix(in srgb,var(--navy) 60%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--navy) 22%,transparent)}.tsm-cd.on .tsm-big{color:var(--tx);text-shadow:0 0 12px color-mix(in srgb,var(--navy) 55%,transparent)}
  .tsm-cd.on.rec{border-color:rgba(255,77,94,.6);box-shadow:0 0 16px rgba(255,77,94,.35)}.tsm-cd.on.rec .tsm-big{text-shadow:0 0 12px rgba(255,77,94,.6)}
  .tsm-rec{border-color:rgba(255,77,94,.5);box-shadow:0 0 22px rgba(255,77,94,.18),0 8px 24px rgba(0,0,0,.22)}
  .mc-svg{width:100%;height:50px;display:block;margin-top:8px;overflow:visible}.mc-track{fill:var(--line)}.mc-l{font-size:9.5px;fill:var(--dim);font-family:ui-monospace,monospace}
  .tsm-stats{margin-top:8px;gap:6px}.tsm-stats>div{background:var(--card2);border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;min-width:0}
  .tsm-stats span{font-size:10px;color:var(--dim)}.tsm-stats b{font-family:ui-monospace,monospace;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tsm-next{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px}
  .tsm-xf{border-color:rgba(57,197,207,.45);box-shadow:0 0 20px rgba(57,197,207,.14),0 8px 24px rgba(0,0,0,.22)}
  .xf-row{display:flex;align-items:center;gap:14px}
  .xf-pc{font-family:ui-monospace,monospace;font-size:42px;font-weight:800;line-height:1;background:linear-gradient(180deg,var(--tx),#2fb5c2 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(57,197,207,.35))}
  .xf-pc small{font-size:20px}
  .xf-bar{position:relative;height:20px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:9px;box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
  .xf-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:10px}
  .xf-bar i.rec{background:repeating-linear-gradient(135deg,rgba(160,180,210,.32) 0 7px,rgba(160,180,210,.16) 7px 14px)}
  .xf-bar i.sent{background:linear-gradient(180deg,#8ef0f6,#39c5cf 45%,#1c8f99);box-shadow:0 0 14px rgba(57,197,207,.65)}
  .xf-bar i.sent::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:30% 100%;background-repeat:no-repeat;animation:tsmS 2.2s linear infinite}
  .xf-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 7px #fff}
  .tl-svg{width:100%;height:62px;display:block}.tl-pulse{animation:tsmP 1.6s ease-in-out infinite}
  .tsm-note{font-size:11.5px;color:var(--dim);margin:2px 0 4px}
  .tsm-3d{position:relative;min-height:340px;border-radius:10px;overflow:hidden;margin:6px 0 4px;border:1px solid color-mix(in srgb,var(--navy) 35%,var(--line));
    background:radial-gradient(ellipse at 50% 30%,rgba(88,166,255,.18),transparent 62%),linear-gradient(180deg,#0a1222,#060a14);box-shadow:inset 0 0 36px rgba(0,0,0,.55)}
  .tsm-3dn{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#8ba0b8}
  .tsm-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .tsm-core{background:radial-gradient(140% 70% at 50% 0%,#12284a 0%,#0a1426 50%,#060c18 100%);color:#e6edf3;border-color:rgba(88,166,255,.38)}
  .tsm-core .tsm-h{color:#fff}.tsm-core .dim{color:#8ea2ba}
  .tsc-wrap{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
  .tsc-wrap .tsc-read{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px}.tsc-wrap .tsc-s{grid-column:1/-1}
  .tsc-3d{position:relative;height:200px;border-radius:10px;overflow:hidden;border:1px solid rgba(88,166,255,.32);box-shadow:inset 0 0 22px rgba(88,166,255,.12)}
  .tsc-fx{position:absolute;inset:0}.tsc-fx canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .tsc-read{display:flex;flex-direction:column;gap:2px;font-size:11.5px}
  .tsc-s{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;margin-bottom:2px}
  .tsc-s i{width:8px;height:8px;border-radius:50%;background:#58a6ff;box-shadow:0 0 8px #58a6ff}

function spark(pts){

  const w=320,h=46,v=pts.map(p=>+p[2]||0),mx=Math.max(...v,1);
  const xy=v.map((y,i)=>[i/(v.length-1)*w,h-y/mx*(h-8)-4]);
  const line=xy.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--navy)" stop-opacity=".42"/>
      <stop offset="100%" stop-color="var(--navy)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${line} ${w},${h}" fill="url(#ar)"/>
    <polyline points="${line}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${xy.at(-1)[0].toFixed(1)}" cy="${xy.at(-1)[1].toFixed(1)}" r="3.5" fill="var(--ok)"/></svg>`;
}

  let h=`<div class="card hero"><div class="dial">

      <div class="tile"><div class="lbl">지향 소스</div>
      <div class="val mono">${esc(d.source&&d.source!=="?"?d.source:"—")}</div>
      <div class="lbl mono">${esc(d.onsrc||"")}</div></div>`;
  }else if(d.next?.exp){
    h+=`<div class="tile" style="margin-bottom:7px"><div class="lbl">다음 관측</div>
      <div class="val mono">${esc(d.next.exp)} <span class="lbl">${esc(d.next.type||"")}</span></div></div>
      <div class="tile hot"><div class="lbl">개시까지</div>
      <div class="val mono" id="cd" style="color:var(--gold);font-size:17px">${hhmmss((n2(d.next.in_sec)??0)-age)}</div>
      <div class="lbl mono">${esc(d.next.start||"")}</div></div>`;
  }
  h+=`</div></div>${live?`<div class="bar run" style="margin-top:13px"><i style="width:${pct}%"></i></div>`:""}</div>`;
  if(d.threestar) h+=vTS(d.threestar);

  h+=`<div class="card"><h2>지금 단계</h2><div class="pipe">`;
  const cur=st.find(s=>s.id===d.current_stage)||st.find(s=>s.state==="running");
  for(const s of st.slice(Math.max(0,st.indexOf(cur)-1),Math.max(3,st.indexOf(cur)+2))){
    h+=stepRow(s,d);
  }
  h+=`</div><div class="lbl" style="text-align:center;margin-top:8px">전체는 [단계] 탭에서</div></div>`;

  if(d.az!=null){
    h+=`<div class="card"><h2>안테나</h2><div style="display:flex;gap:13px;align-items:center">
      ${sky(n2(d.az),n2(d.el),live,false)}

        <div class="tile"><div class="lbl">방위 Az</div><div class="val mono">${n2(d.az).toFixed(2)}°</div></div>
        <div class="tile"><div class="lbl">고도 El</div><div class="val mono">${(n2(d.el)??0).toFixed(2)}°</div></div>
      </div></div></div>`;
  }
  return h;
}

  ensureThree().then(okk=>{

    const sl=document.getElementById("tsBeamSlot"); if(!sl) return;
    // 글(측정 시각·소스·오프셋·색 막대)은 그래프 위 띠에, 그래프는 그 아래 칸에 — 좁은 화면에서 글 상자가 곡면을 가리지 않게(10-03)
    if(!TSCV){ TSBW=document.createElement("div"); const mt=document.createElement("div"); mt.className="tsm-3dm";
      const bx=document.createElement("div"); bx.className="tsm-3dc"; TSCV=document.createElement("canvas"); TSCV.className="tsm-cv";

    const full=t=>t?new Date((t+9*3600)*1000).toISOString().slice(0,16).replace("T"," ")+" KST":"—";
    const sc=ri?ri.src:cf.source, meta={when:ri?full(ri.t):"이번 세션", src:SRCN[sc]?`${SRCN[sc]} (${sc})`:(sc||""), band:`${ch.band||""} 대역 · ${TSCH}`,

function tickTSL(){
  if(TAB!=="ts"||!TSL||(!TSL.session&&!TSL.pcamp)) return;
  const q=id=>document.getElementById(id), now=Date.now()/1000;
  if(TSL&&TSL.pcamp&&TSL.pcamp.next_t&&q("tsPcCd")) q("tsPcCd").textContent=mmss(TSL.pcamp.next_t-now);
  if(!TSL.session){ mountTSAnt(); return; }
  const s=TSL.session, cur=s.current||{}, nx=s.next||{};
  mountTSAnt();
  if(q("tsClk")) q("tsClk").textContent=kst(now);
  if(q("tsUtc")) q("tsUtc").textContent=new Date(now*1000).toISOString().slice(11,19);
  if(q("tsRem")) q("tsRem").textContent=hhmmss((s.last_stop||now)-now);
  const before=cur.start&&now<cur.start;
  if(q("tsCd1")&&before) q("tsCd1").textContent=mmss(cur.start-now);
  if(q("tsCd2")&&!before) q("tsCd2").textContent=mmss((cur.stop||now)-now);

  if(q("tsCycWrap")) q("tsCycWrap").innerHTML=cycleSvg(TSL,cur);

function stepRow(s,d){
  const cls="s-"+(s.state||"ready"), cur=s.id===d.current_stage;
  return `<div class="st ${cls}" onclick="go('stages')">
    <div class="dot">${cls==="s-running"?'<i class="pulse" style="width:8px;height:8px;background:#fff"></i>':
      (s.state==="done"?"✓":s.state==="failed"||s.state==="warn"?"!":s.state==="skipped"?"–":"")}</div>
    <div style="flex:1;min-width:0"><div class="nm">${esc(s.name||s.id)}<span class="kind">${esc(KIND[s.kind]||"")}</span></div>
    <div class="sub">${cur&&s.state!=="done"?"지금 진행 중":STXT[s.state]||"대기"}</div></div></div>`;
}

function vStages(d,st){
  let h=`<div class="card"><h2>파이프라인 10단계</h2><div class="pipe">`;
  st.forEach(s=>h+=stepRow(s,d)); h+=`</div></div>`;

  st.forEach((s,i)=>{

    h+=`<div class="sc s-${s.state||"ready"}">
      <div class="h"><span class="num-badge">${i+1}</span>${esc(inf[0])}

      ${inf[2]?`<div class="m">막히면 → ${esc(inf[2])}</div>`:""}</div>`;
  });
  return h+`</div>`;
}

      <div class="tile"><div class="lbl">인터록</div><div class="val" style="color:${lock?"var(--ok)":"var(--bad)"}">${lock?"해제":"작동"}</div></div>
      <div class="tile"><div class="lbl">지향 소스</div><div class="val mono">${esc(d.source&&d.source!=="?"?d.source:"—")}</div></div>
    </div>
    <div class="lbl" style="margin-top:11px;display:flex;gap:7px;align-items:center">
      <span style="width:10px;height:10px;border:1px dashed var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent);display:inline-block"></span>
      붉은 부채꼴 = X대역 간섭 방위 (진북 236°±2°) · 안쪽일수록 높은 고도</div></div>`;
}

function vTrans(d){
  const ts=d.transfers||[];
  if(!ts.length) return `<div class="card"><div class="empty">진행 중인 전송이 없습니다</div></div>`;
  let h="";
  for(const t of ts){
    const p=Math.max(0,Math.min(100,n2(t.pct)||0));
    h+=`<div class="card"><h2>${esc(t.exp)} → ${esc(t.target||"")}</h2>
      <div class="dial" style="margin-bottom:12px">${ring(p,p.toFixed(0)+"%","전송")}
        <div style="flex:1" class="grid">
          <div class="tile hot"><div class="lbl">속도</div><div class="val mono">${t.rate_mbs!=null?esc(t.rate_mbs)+" <span class='lbl'>MB/s</span>":"—"}</div></div>
          <div class="tile"><div class="lbl">남은 시간</div><div class="val mono">${t.eta_h!=null?Number(t.eta_h).toFixed(1)+" <span class='lbl'>시간</span>":"—"}</div></div>
          <div class="tile"><div class="lbl">그룹</div><div class="val mono">${esc(t.done_groups??"–")} / ${esc(t.total_groups??"–")}</div></div>
        </div></div>
      <div class="bar run"><i style="width:${p}%"></i></div>
      ${spark((d.et_hist||{})[t.exp])}
      <div class="lbl" style="margin-top:4px">속도 추이 — 최근 ${((d.et_hist||{})[t.exp]||[]).length}점</div></div>`;
  }
  return h;
}

let PLOTS=null, PLOTSEL=0;
async function loadPlots(){
  if(PLOTS) return PLOTS;
  try{
    const d=await jget("kvgcs_plots.json");
    return (PLOTS=d.plots||[]);
  }catch(e){ return (PLOTS=[]); }
}
function vBeam(){
  if(PLOTS===null){ loadPlots().then(()=>render()); 
    return `<div class="card"><div class="empty">포인팅 그래프를 불러오는 중…</div></div>`; }
  if(!PLOTS.length) return `<div class="card"><div class="empty">
    포인팅 그래프가 아직 없습니다<div class="lbl" style="margin-top:8px">
    십자 스캔을 수행하면 콘솔이 빔 패턴을 만듭니다</div></div></div>`;
  const sel=PLOTS[Math.min(PLOTSEL,PLOTS.length-1)];
  let h=`<div class="card"><h2>3D 포인팅 · 빔 패턴</h2>
    <div style="display:flex;gap:5px;overflow-x:auto;padding-bottom:9px">`;
  PLOTS.forEach((p,i)=>{h+=`<div class="tab ${i===PLOTSEL?"on":""}" onclick="PLOTSEL=${i};render()">${esc(p.t)}</div>`;});
  h+=`</div>
    <div style="background:#fff;border-radius:12px;overflow:hidden">
      <img src="data:image/${sel.mime||"png"};base64,${sel.png}" style="width:100%;display:block" alt="${esc(sel.t)}"></div>
    <div class="lbl" style="margin-top:8px">${esc(sel.t)} · 두 손가락으로 확대할 수 있다</div></div>`;
  return h;
}

function vGlobe(){
  return `<div class="card" style="padding:0;overflow:hidden">
    <iframe id="ifgl" style="width:100%;height:86vh;border:0;display:block;background:#000"
      allow="fullscreen"></iframe></div>`;
}

function v3D(){
  return `<div class="card" style="padding:0;overflow:hidden">
    <iframe id="if3d" style="width:100%;height:86vh;border:0;display:block;background:var(--card)"
      allow="accelerometer;gyroscope"></iframe></div>`;
}
async function mountFrames(){
  // 같은 오리진 — 평범한 iframe (콘솔에서 돌던 조건)
  if(TAB==="d3"){const f=document.getElementById("if3d");
    if(f&&!f.dataset.on){f.dataset.on="1"; f.src="./antenna3d.html?v="+REV;}}
  if(TAB==="globe"){const f=document.getElementById("ifgl");
    if(f&&!f.dataset.on){f.dataset.on="1";
      const code=(GLOBECODE||((D&&(D.sched_exp||D.exp))||"")).toLowerCase();
      f.src="./globe.html?v="+REV+(code&&code!=="none"?"&code="+encodeURIComponent(code):"");}}
}
addEventListener("message",e=>{               // 지구본 안 세션 선택 → iframe 재조립
  const c=e.data&&e.data.kvgcsCode;
  if(c){GLOBECODE=String(c).toLowerCase();
    const f=document.getElementById("ifgl"); if(f) delete f.dataset.on;
    render();}
});

function vTheme(){
  let h=`<div class="card"><h2>테마</h2>
    <div class="lbl" style="margin-bottom:10px">고른 테마는 이 기기에 저장된다</div>`;
  for(const [k,name,desc] of THEMES){
    const on=(THEME===k);
    h+=`<div class="tile" onclick="setTheme('${k}')" style="cursor:pointer;margin-bottom:8px;
        border-color:${on?"var(--navy)":"transparent"};display:flex;align-items:center;gap:11px">
      <div style="width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:grid;place-items:center;
        border:2px solid ${on?"var(--navy)":"var(--line)"};background:${on?"var(--navy)":"transparent"};
        color:#fff;font-size:11px;font-weight:800">${on?"✓":""}</div>
      <div style="flex:1;min-width:0">
        <div class="val" style="font-size:14px">${esc(name)}</div>
        <div class="lbl">${esc(desc)}</div>
      </div>
      <div style="display:flex;gap:3px">${
        ["--bg","--card","--navy","--gold","--ok"].map(v=>
          `<span style="width:13px;height:22px;border-radius:3px;border:1px solid var(--line);
            background:${k==="auto"?"var("+v+")":swatch(k,v)}"></span>`).join("")}</div>
    </div>`;
  }
  return h+`</div>`;
}
const SW={
  dark:{"--bg":"#080e16","--card":"#121d2c","--navy":"#4aa3ff","--gold":"#eab94a","--ok":"#2fd982"},
  light:{"--bg":"#eaeff7","--card":"#ffffff","--navy":"#1670d6","--gold":"#b3860f","--ok":"#10a45b"},
  ops:{"--bg":"#000000","--card":"#12100a","--navy":"#ffb340","--gold":"#ffd24a","--ok":"#8fd14f"},
  night:{"--bg":"#04070b","--card":"#0b1119","--navy":"#3f7fbf","--gold":"#b08f45","--ok":"#3f9e68"},
  blueprint:{"--bg":"#071a2b","--card":"#0d2b44","--navy":"#5cc8ff","--gold":"#ffd98a","--ok":"#4fd6a0"},
  paper:{"--bg":"#f6f4ee","--card":"#ffffff","--navy":"#1c5fa8","--gold":"#96701a","--ok":"#187a4a"},
};
const swatch=(k,v)=>(SW[k]&&SW[k][v])||"var("+v+")";

function vSys(d){
  const fm=n2(d.fmout_gps_us), lvl=d.monitor_level||"idle";
  const mc={ok:"c-live",idle:"c-idle",warn:"c-warn",error:"c-bad",fail:"c-bad"}[lvl]||"c-idle";
  let h=`<div class="card"><h2>계통</h2><div class="grid g2">
    <div class="tile hot"><div class="lbl">클럭 오프셋 (FMOUT−GPS)</div>
      <div class="val mono">${fm!=null?fm.toFixed(2)+" <span class='lbl'>µs</span>":"—"}</div></div>
    <div class="tile"><div class="lbl">기록 디스크 준비</div><div class="val mono">${esc(d.disks_ready??"–")}</div></div>
    <div class="tile"><div class="lbl">기록 응답</div><div class="val mono">${esc(d.record_reply||"—")}</div></div>
    <div class="tile"><div class="lbl">운전 모드</div><div class="val">${esc(d.mode||"—")}</div></div>
  </div></div>`;
  h+=`<div class="card"><h2>감시</h2><div class="row">
      <div><div class="lbl">진행 감시 판정</div><div class="val">${esc(lvl)}</div></div>
      <span class="chip ${mc}">${lvl==="idle"?"대기":lvl==="ok"?"정상":"확인 필요"}</span></div>
    ${d.monitor_msg?`<div class="lbl" style="margin-top:9px">${esc(d.monitor_msg)}</div>`:""}`;
  for(const c of (d.monitor_checks||[])){
    h+=`<div class="row" style="margin-top:7px"><span class="lbl">${esc(c.name)}</span>
      <span class="chip ${c.ok?"c-live":"c-bad"}">${c.ok?"OK":"!"}</span></div>`;
  }
  h+=`</div><div class="card"><h2>시각</h2>
    <div class="tile"><div class="lbl">서버 UT</div><div class="val mono">${esc(d.now_utc||"—")}</div></div>
    <div class="lbl" style="margin-top:9px">스냅샷 ${esc(d.generated||"")}</div></div>`;
  return h;
}

function go(t){TAB=t; TG?.HapticFeedback?.selectionChanged?.(); render();
  if(t==="ts") loadTSL().then(()=>{ if(TAB==="ts") render(); });}

function render(full=true){
  const d=D; if(!d) return;
  const age=(Date.now()-t0)/1000+drift;
  const live=!!d.observing, pct=Math.max(0,Math.min(100,n2(d.pct)||0));
  const st=d.stages||[], doneN=st.filter(s=>["done","skipped"].includes(s.state)).length;
  const stale=(n2(d.stale_sec)??0)>180||age>240;
  const bad=st.filter(s=>["failed","warn"].includes(s.state)).length;

  document.getElementById("top").innerHTML=
    `<div><div class="exp mono">${esc(d.exp||"—")}</div>
     <div class="sub">세종 22 m · KVGSJ${d.engine==="threestar"?' · <b style="color:#d4af37">ThreeStar ★★★</b> 자동 관측':""}</div></div>
     <span class="chip ${live?"c-live":stale?"c-bad":"c-idle"}">
       ${live?'<i class="pulse"></i>관측 중':stale?"연결 끊김":"대기"}</span>`;

  const T=[["over","개요",""],["ts","★ ThreeStar",""],["stages","단계",`${doneN}/${st.length}`],
           ["ant","안테나",""],["d3","3D",""],["beam","포인팅",""],["globe","지구본",""],["tr","전송",(d.transfers||[]).length||""],
           ["sys","계통",bad?String(bad):""],["theme","테마",""]];
  document.getElementById("tabs").innerHTML=T.map(([k,n,b])=>
    `<div class="tab ${TAB===k?"on":""}" onclick="go('${k}')">${n}${b?`<span class="b">${b}</span>`:""}</div>`).join("");

  // 3D·지구본 탭은 iframe 이다 — 데이터 수신 때 재생성하면 Cesium 이 통째로 리로드되어
  // 화면이 주기적으로 깜빡인다. iframe 이 이미 떠 있으면 절대 다시 만들지 않는다.
  if(full && (TAB==="d3"||TAB==="globe") && document.querySelector("#app iframe")) full=false;
  if(!full){                       // 매초 호출 — 흐르는 값만 갈아 끼운다(깜빡임 없음)
    const cd=document.getElementById("cd");
    if(cd&&d.next) cd.textContent=hhmmss((n2(d.next.in_sec)??0)-age);
    tickTSL();
    const ft=document.getElementById("foot");
    if(ft) ft.innerHTML=`<span class="pulse" style="color:${stale?"var(--bad)":"var(--ok)"}"></span>
      ${ago(age)} 갱신 · 30초마다 자동 · 조회 전용`;
    return;
  }
  const v={over:()=>vOver(d,live,pct,st,doneN,age),ts:()=>vTSL(),stages:()=>vStages(d,st),
           ant:()=>vAnt(d,live),d3:()=>v3D(),beam:()=>vBeam(),globe:()=>vGlobe(),tr:()=>vTrans(d),sys:()=>vSys(d),theme:()=>vTheme()}[TAB];
  const app=document.getElementById("app");
  app.innerHTML=`<div class="view">${v()}</div>`;
  mountFrames();
  mountTS3D(); mountTSAnt(); mountTSSky(); mountTSCore(); mountTSFlow();
  document.getElementById("foot").innerHTML=
    `<span class="pulse" style="color:${stale?"var(--bad)":"var(--ok)"}"></span>
     ${ago(age)} 갱신 · 15초마다 자동 · 조회 전용`;
}

async function pull(){
  try{
    const nd=await jget("kvgcs_status.json");
    const same=D&&JSON.stringify(nd)===JSON.stringify(D);
    D=nd;
    drift=D.gen_epoch?Math.max(0,Date.now()/1000-D.gen_epoch):0;
    let tsNew=false;
    if(TAB==="ts"){ const g=TSL&&TSL.gen_epoch; await loadTSL(); tsNew=(TSL&&TSL.gen_epoch)!==g; }
    t0=Date.now(); render(!same||tsNew);
  }catch(e){
    document.getElementById("app").innerHTML=
      `<div class="card"><div class="err">상태를 불러오지 못했습니다</div>
       <div class="lbl" style="margin-top:7px">${esc(e.message)}</div>
       <div class="lbl" style="margin-top:11px">콘솔이 꺼져 있거나 발행이 멈췄을 수 있습니다.</div></div>`;
  }
}
pull();
setInterval(pull,30000);
// 페이지 효과 — three.js·fx3d 를 처음에 한 번 불러 모든 메뉴에서 돈다(10-04 센터장님 "전체 페이지 첨단 3js 이팩트")
ensureThree().then(okk=>{ if(okk&&window.PageFx){ try{ window.PageFx.create({canvas:document.getElementById("pageFx"),overlay:document.getElementById("pageFxTop"),cards:".card",count:240}); }catch(e){} } });
setInterval(()=>{if(D&&TAB!=='d3'&&TAB!=='globe'&&TAB!=='beam')render(false);},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull();});
</script>
</body>
</html>
